<style>
    .divImagen {
        display: flex;
        width: 100%;
        flex-direction: column;
        align-items: center;
        border: 1px dashed #7daee6;
        border-radius: 10px;
        padding-block: 24px;
        transition: all 0.2s ease;
    }

    .divImagen--drag-active {
        border: 1px dashed #0056b3;
        background-color: #cce5ff;
        opacity: 0.5;
    }
</style>
@if(!imageChangedEvent){
<div id="divImagen" class="divImagen mb-2" [class.divImagen--drag-active]="dragActivo"
    (dragenter)="onDragEnter($event)" (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)" (drop)="onDrop($event)" (click)="fileInput.click()"
    style="cursor: pointer;">

    @if (!preview) {
    <p class="mb-0 text-center text-muted">{{mensajeImagen}}</p>
    } @else {
    <div class="text-center">
        <img [src]="preview" alt="Previsualización" class="img-thumbnail mb-2" [class.rounded-circle]="esPerfil"
            style="max-height: 120px; object-fit: cover;" />
        <p class="mb-0 text-success small fw-bold">¡Imagen cargada con éxito!</p>
        <p class="text-muted small mb-0">(Haz clic o arrastra otra para cambiarla)</p>
    </div>
    }
    <input id="imagen" type="file" #fileInput hidden (change)="onFileSelected($event)"
        accept="image/png, image/jpeg, image/jpg" />
</div>
<div class="col-12">
    @if(error){
    <div class="alert alert-danger m-2 p-2 text-center w-100" role="alert">
        {{error}}
    </div>
    }
</div>
}@else{
    <div  class="animate__animated animate__slideInLeft g-3 d-flex flex-column">
        <image-cropper [imageChangedEvent]="imageChangedEvent" [maintainAspectRatio]="true" [aspectRatio]="aspectRatio"
            (imageCropped)="onImageCropper($event)" [roundCropper]="esPerfil" [containWithinAspectRatio]="true"
            (imageLoaded)="onImageLoaded()"
            >
        </image-cropper>
        <br>
        @if(imagenCargada){
        <div class="row ">
            <div class="col-4">
                <button type="button" class="btn btn-outline-danger w-100" (click)="cancelarRecorte()">Cancelar</button>
            </div>
            <div class="col-8">
                <button type="button" class="btn btn-primary w-100" (click)="aplicarRecorte()">Aplicar recorte </button>
            </div>
        </div>
        }@else {
            <button class="btn btn-secondary text-center mt-1 w-100 fw-bold" type="button" disabled>
                <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                <span role="status">Cargando...</span>
            </button>
        }
    </div>
}
