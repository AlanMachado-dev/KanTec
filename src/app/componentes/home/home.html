<style>
    .crear-tablero {
        height: 100%;
        min-height: 250px;
        border: 3px dashed #999;
        cursor: pointer;
    }
    .crear-tablero:hover {
        transform: scale(1.02);
    }
    .imagenTablero{
        height: 200px; 
        object-fit: cover;
    }
    .colorFondoTablero{
        height: 200px;
        object-fit: cover;
    }
</style>

<div class="row row-cols-1 row-cols-md-3 g-4 mt-4 ms-4">

    @for(tablero of tablerosPaginados; track tablero.id){
    <div class="col" >
        <div class="card">
            <a [routerLink]="['/tablero',tablero.id]">
                @if(tablero.imagen){
                    <img [src]="rutaImagenes + tablero.imagen" class="card-img-top imagenTablero" alt="..." >
                }@else {
                    <div [style.background-color]="tablero.color" class="colorFondoTablero">
                        <!-- {{tablero.titulo}} -->
                    </div>
                }
            </a>
            <div class="card-body">
                <p class="card-title"><b>{{tablero.titulo}}</b> by {{tablero.aliasCreador}}</p>
                <!-- <p class="card-text">[usuario1] [usuario2] [usuario3]</p> -->
            </div>
        </div>
    </div>
    }
    @if (paginaActual === totalPaginas){
        <div class="col">
            <div class="card crear-tablero" (click)="crearTablero()">
                <div class="card-body d-flex align-items-center justify-content-center">
                    <h1>+</h1>
                </div>
            </div>
        </div>
    }
    
</div>
<div class="d-flex mt-5">
    <nav aria-label="..." class="m-auto">
        <ul class="pagination">
            <li class="page-item">
                <button class="page-link" (click)="anterior()">
                    Previous
                </button>
            </li>
            @for(pagina of paginas; track pagina) {

            <li class="page-item" [class.active]="pagina === paginaActual">

                <button class="page-link" (click)="cambiarPagina(pagina)">
                    {{pagina}}
                </button>
            </li>

            }

            <li class="page-item">
                <button class="page-link" (click)="siguiente()">
                    Next
                </button>
            </li>
            
        </ul>
    </nav>
</div>
